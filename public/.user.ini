; Raise upload limits so the Media Gallery's 200MB file-size validation
; (see MediaController@store) is not blocked by PHP's own defaults.
; Works automatically on most shared hosts (PHP-FPM / CGI). Has no effect
; under mod_php or the local `php artisan serve` dev server — those read
; php.ini directly and must be edited there instead.
upload_max_filesize = 220M
post_max_size = 250M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
